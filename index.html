<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engineering Notes</title>

  <!--
    Tiny inline script that runs BEFORE the page paints.
    It reads the saved theme (or the OS preference) and sets it on <html>.
    Doing this early avoids a flash of the wrong theme on page load.
    app.js takes over theme handling afterwards (toggle button, saving).
  -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('blog.theme'); } catch (e) { /* storage blocked: ignore */ }
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    })();
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Site header: brand on the left, actions on the right -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#/">Engineering Notes</a>

      <nav class="header-actions" aria-label="Site actions">
        <a class="btn btn-primary" href="#/new" data-author-only hidden>New post</a>
        <button class="btn" id="btn-export" type="button" data-author-only hidden title="Download all posts and images as one JSON file">Export</button>
        <button class="btn" id="btn-import" type="button" data-author-only hidden title="Load a JSON backup file">Import</button>
        <button class="btn btn-icon" id="btn-theme" type="button" aria-label="Toggle dark and light theme"></button>
        <!-- Hidden file input that the Import button clicks for us -->
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </nav>
    </div>
  </header>

  <!-- Every "page" is rendered into this element by app.js -->
  <main id="app" class="container" tabindex="-1"></main>

  <!-- Small pop-up messages ("Saved", "Storage is full", ...) -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <footer class="site-footer">
    <div class="container">Built with plain HTML, CSS and JavaScript.</div>
  </footer>

  <!--
    Script order matters. Classic scripts (not ES modules) are used on purpose:
    browsers block <script type="module"> when a page is opened from file://,
    and you wanted index.html to work by double-clicking it.

    1. Libraries from a CDN
    2. Our own files: markdown.js and storage.js define global objects,
       app.js uses them.
  -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
